<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Safi. Founder, TechAmber. Software that sells.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B0D10"/><stop offset="1" stop-color="#14171C"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.18" cy="0.3" r="0.6">
    <stop offset="0" stop-color="#F5A524" stop-opacity="0.16"/><stop offset="1" stop-color="#F5A524" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
  </pattern>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.07"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="card"><rect width="1200" height="320" rx="16"/></clipPath>
</defs>
<style>
  .name { font: 700 84px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #F2F3F5; letter-spacing: -2px; opacity: 0; animation: rise 1.1s cubic-bezier(.2,.7,.2,1) .2s forwards; }
  .dot  { fill: #F5A524; opacity: 0; animation: rise 1.1s cubic-bezier(.2,.7,.2,1) .35s forwards; }
  .sub  { font: 500 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #A9AFB8; opacity: 0; animation: rise 1s cubic-bezier(.2,.7,.2,1) .9s forwards; }
  .tag  { font: 500 15px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #6B7280; letter-spacing: 2px; opacity: 0; animation: fade 1s ease 1.5s forwards; }
  .tag b { fill: #F5A524; font-weight: 500; }
  .rule { stroke: #F5A524; stroke-width: 2; stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw 1.2s cubic-bezier(.6,0,.2,1) .7s forwards; }
  .curt { animation: blinkf 1.1s steps(1) infinite; }
  @keyframes blinkf { 0%,50% { fill: #F5A524; } 51%,100% { fill: transparent; } }
  .sheen { animation: sweep 7s ease-in-out 2s infinite; }
  .orbit { transform-origin: 1010px 160px; animation: spin 40s linear infinite; }
  .pulse { animation: pulse 3.2s ease-in-out infinite; transform-origin: 1010px 160px; }
  @keyframes rise { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: none; } }
  @keyframes fade { to { opacity:1; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes blink { 0%,50% { opacity:1; } 51%,100% { opacity:0; } }
  @keyframes sweep { 0% { transform: translateX(-500px); } 45%,100% { transform: translateX(1300px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity:.35; transform: scale(1); } 50% { opacity:.8; transform: scale(1.06); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important; } }
</style>
<g clip-path="url(#card)">
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- precision mark: concentric rings + ticks -->
  <g class="orbit" fill="none" stroke="#FFFFFF" stroke-opacity="0.10">
    <circle cx="1010" cy="160" r="110"/>
    <circle cx="1010" cy="160" r="110" stroke="#F5A524" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="60 631"/>
    <line x1="1010" y1="44" x2="1010" y2="58" transform="rotate(0 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(10 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(20 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(30 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(40 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(50 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="58" transform="rotate(60 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(70 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(80 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(90 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(100 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(110 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="58" transform="rotate(120 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(130 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(140 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(150 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(160 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(170 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="58" transform="rotate(180 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(190 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(200 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(210 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(220 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(230 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="58" transform="rotate(240 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(250 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(260 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(270 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(280 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(290 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="58" transform="rotate(300 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(310 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(320 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(330 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(340 1010 160)"/><line x1="1010" y1="44" x2="1010" y2="52" transform="rotate(350 1010 160)"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.08">
    <circle cx="1010" cy="160" r="72"/>
    <line x1="1010" y1="70" x2="1010" y2="250"/><line x1="920" y1="160" x2="1100" y2="160"/>
  </g>
  <circle class="pulse" cx="1010" cy="160" r="34" fill="none" stroke="#F5A524" stroke-opacity="0.6"/>
  <circle cx="1010" cy="160" r="4" fill="#F5A524"/>

  <text class="tag" x="80" y="78">FOUNDER · <tspan class="b" fill="#F5A524">TECHAMBER</tspan> · MORADABAD, IN</text>
  <text class="name" x="76" y="170">Safi<tspan fill="#F5A524">.</tspan></text>

  <line class="rule" x1="80" y1="198" x2="300" y2="198"/>
  <text class="sub" x="80" y="246">I build software that sells.<tspan class="curt" dx="4">▍</tspan></text>


  <rect class="sheen" x="0" y="0" width="420" height="320" fill="url(#sheen)" transform="skewX(-20)"/>
  <rect width="1199" height="319" x=".5" y=".5" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
</g>
</svg>